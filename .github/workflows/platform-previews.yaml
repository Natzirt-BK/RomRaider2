name: Platform packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify shared versions and rejection fixtures
        run: bash packaging/test-version-check.sh

  macos-package:
    needs: version-consistency
    name: macOS ${{ matrix.package_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            java_arch: arm64
            package_arch: arm64
          - runner: macos-15-intel
            java_arch: x64
            package_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: ${{ matrix.java_arch }}
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Install Ant
        run: command -v ant >/dev/null || brew install ant
      - name: Test and build native application
        run: |
          cp packaging/default/settings.xml settings.xml
          ant clean unittest
          env RR2_NATIVE_AWAKE_TEST=1 java -cp 'build/test:lib/common/*:lib/testing/*' com.romraider.ui.DesktopDisplayAwakeNativeProbe
          ant clean build-macos
          gradle --no-daemon :platform:shared-core:check :ui:compose-logger:test :ui:compose-logger:stageLoggerWorkspace
          packaging/java21/build-macos-app-image.sh "build/macos-${{ matrix.package_arch }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos-${{ matrix.package_arch }}/RomRaider2.app" \
            "build/RomRaider2_1.1.5_macOS_${{ matrix.package_arch }}.zip"
          (
            cd build
            shasum -a 256 \
              "RomRaider2_1.1.5_macOS_${{ matrix.package_arch }}.zip" \
              >"RomRaider2_1.1.5_macOS_${{ matrix.package_arch }}.zip.sha256"
          )
      - name: Check whitespace
        run: git diff --check
      - name: Upload unsigned macOS package
        uses: actions/upload-artifact@v4
        with:
          name: RomRaider2-1.1.5-macOS-${{ matrix.package_arch }}-unsigned
          path: |
            build/RomRaider2_1.1.5_macOS_${{ matrix.package_arch }}.zip
            build/RomRaider2_1.1.5_macOS_${{ matrix.package_arch }}.zip.sha256
          if-no-files-found: error

  android-debug:
    needs: version-consistency
    # Distribution credentials are never exposed to arbitrary dispatch branches.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Restore persistent Android signing key
        env:
          RR2_ANDROID_KEYSTORE_BASE64: ${{ secrets.RR2_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RR2_ANDROID_KEYSTORE_BASE64" || { echo 'Android signing secret is missing; refusing unsigned distribution.' >&2; exit 1; }
          umask 077
          printf '%s' "$RR2_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/romraider2-signing.p12"
      - name: Check portable core and build Android package
        env:
          RR2_ANDROID_SIGNING_REQUIRED: "true"
          RR2_ANDROID_KEYSTORE: ${{ runner.temp }}/romraider2-signing.p12
          RR2_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RR2_ANDROID_KEYSTORE_PASSWORD }}
          RR2_ANDROID_KEY_ALIAS: romraider2
          RR2_ANDROID_KEY_PASSWORD: ${{ secrets.RR2_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon --no-configuration-cache -p platform/android \
            :shared-core:check :app:testDebugUnitTest :app:assembleDebug :app:lintDebug \
            :app:assembleOpenportDiagnostic :app:lintOpenportDiagnostic
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt" bash packaging/android/check-service-manifest.sh \
            production platform/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt" bash packaging/android/check-service-manifest.sh \
            production platform/android/app/build/outputs/apk/openportDiagnostic/app-openportDiagnostic.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt" bash packaging/android/verify-package-version.sh \
            com.romraider.mobile.preview platform/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt" bash packaging/android/verify-package-version.sh \
            com.romraider.mobile.preview.openporttest platform/android/app/build/outputs/apk/openportDiagnostic/app-openportDiagnostic.apk
          bash packaging/android/verify-notices.sh \
            platform/android/app/build/outputs/apk/debug/app-debug.apk \
            platform/android/app/build/outputs/apk/openportDiagnostic/app-openportDiagnostic.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            bash packaging/android/verify-signing.sh "$(< packaging/android/signing-certificate.sha256)" \
              platform/android/app/build/outputs/apk/debug/app-debug.apk \
              platform/android/app/build/outputs/apk/openportDiagnostic/app-openportDiagnostic.apk
          mkdir -p build/platform-packages
          cp platform/android/app/build/outputs/apk/debug/app-debug.apk \
            build/platform-packages/RomRaider2_1.1.5_Android-debug.apk
          cp platform/android/app/build/outputs/apk/openportDiagnostic/app-openportDiagnostic.apk \
            build/platform-packages/RomRaider2_1.1.5_Android-side-by-side-test.apk
          (
            cd build/platform-packages
            sha256sum RomRaider2_1.1.5_Android-debug.apk \
              >RomRaider2_1.1.5_Android-debug.apk.sha256
            sha256sum RomRaider2_1.1.5_Android-side-by-side-test.apk \
              >RomRaider2_1.1.5_Android-side-by-side-test.apk.sha256
          )
      - name: Check whitespace
        run: git diff --check
      - name: Upload Android debug package
        uses: actions/upload-artifact@v4
        with:
          name: RomRaider2-1.1.5-Android-debug
          path: |
            build/platform-packages/RomRaider2_1.1.5_Android-debug.apk
            build/platform-packages/RomRaider2_1.1.5_Android-debug.apk.sha256
            build/platform-packages/RomRaider2_1.1.5_Android-side-by-side-test.apk
            build/platform-packages/RomRaider2_1.1.5_Android-side-by-side-test.apk.sha256
          if-no-files-found: error

      - name: Remove temporary Android signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/romraider2-signing.p12"

  steamos-package:
    needs: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y ant xvfb zip
      - name: Build SteamOS Desktop Mode package
        run: |
          cp packaging/default/settings.xml settings.xml
          timeout 10m xvfb-run -a ant clean unittest
          ant clean build-linux
          gradle --no-daemon :platform:shared-core:check :ui:compose-logger:test :ui:compose-logger:stageLoggerWorkspace :ui:javafx-desktop:stageJavaFxLinux
          packaging/java21/build-linux-app-image.sh build/java21
          packaging/steamos/build-steamos-bundle.sh
          cd build/steamos
          zip -qr ../RomRaider2_SteamOS_1.1.5_x64.zip \
            RomRaider2_SteamOS_1.1.5_x64
          cd ..
          sha256sum RomRaider2_SteamOS_1.1.5_x64.zip \
            >RomRaider2_SteamOS_1.1.5_x64.zip.sha256
      - name: Check whitespace
        run: git diff --check
      - name: Upload SteamOS Desktop Mode package
        uses: actions/upload-artifact@v4
        with:
          name: RomRaider2-1.1.5-SteamOS-x64
          path: |
            build/RomRaider2_SteamOS_1.1.5_x64.zip
            build/RomRaider2_SteamOS_1.1.5_x64.zip.sha256
          if-no-files-found: error
