name: Platform packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-package:
    name: macOS ${{ matrix.package_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            java_arch: arm64
            package_arch: arm64
          - runner: macos-15-intel
            java_arch: x64
            package_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: ${{ matrix.java_arch }}
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Install Ant
        run: command -v ant >/dev/null || brew install ant
      - name: Test and build native application
        run: |
          cp packaging/default/settings.xml settings.xml
          ant clean unittest
          ant clean build-macos
          gradle --no-daemon :platform:shared-core:check :ui:compose-logger:test :ui:compose-logger:stageLoggerWorkspace
          packaging/java21/build-macos-app-image.sh "build/macos-${{ matrix.package_arch }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos-${{ matrix.package_arch }}/RomRaider2.app" \
            "build/RomRaider2_1.1.1_macOS_${{ matrix.package_arch }}.zip"
          (
            cd build
            shasum -a 256 \
              "RomRaider2_1.1.1_macOS_${{ matrix.package_arch }}.zip" \
              >"RomRaider2_1.1.1_macOS_${{ matrix.package_arch }}.zip.sha256"
          )
      - name: Check whitespace
        run: git diff --check
      - name: Upload unsigned macOS package
        uses: actions/upload-artifact@v4
        with:
          name: RomRaider2-1.1.1-macOS-${{ matrix.package_arch }}-unsigned
          path: |
            build/RomRaider2_1.1.1_macOS_${{ matrix.package_arch }}.zip
            build/RomRaider2_1.1.1_macOS_${{ matrix.package_arch }}.zip.sha256
          if-no-files-found: error

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Check portable core and build Android package
        run: |
          gradle --no-daemon -p platform/android \
            :shared-core:check :app:testDebugUnitTest :app:assembleDebug :app:lintDebug \
            :app:assembleOpenportDiagnostic :app:lintOpenportDiagnostic
          mkdir -p build/platform-packages
          cp platform/android/app/build/outputs/apk/debug/app-debug.apk \
            build/platform-packages/RomRaider2_1.1.1_Android-debug.apk
          cp platform/android/app/build/outputs/apk/openportDiagnostic/app-openportDiagnostic.apk \
            build/platform-packages/RomRaider2_1.1.1_Android-side-by-side-test.apk
          (
            cd build/platform-packages
            sha256sum RomRaider2_1.1.1_Android-debug.apk \
              >RomRaider2_1.1.1_Android-debug.apk.sha256
            sha256sum RomRaider2_1.1.1_Android-side-by-side-test.apk \
              >RomRaider2_1.1.1_Android-side-by-side-test.apk.sha256
          )
      - name: Check whitespace
        run: git diff --check
      - name: Upload Android debug package
        uses: actions/upload-artifact@v4
        with:
          name: RomRaider2-1.1.1-Android-debug
          path: |
            build/platform-packages/RomRaider2_1.1.1_Android-debug.apk
            build/platform-packages/RomRaider2_1.1.1_Android-debug.apk.sha256
            build/platform-packages/RomRaider2_1.1.1_Android-side-by-side-test.apk
            build/platform-packages/RomRaider2_1.1.1_Android-side-by-side-test.apk.sha256
          if-no-files-found: error

  steamos-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y ant xvfb zip
      - name: Build SteamOS Desktop Mode package
        run: |
          cp packaging/default/settings.xml settings.xml
          timeout 10m xvfb-run -a ant clean unittest
          ant clean build-linux
          gradle --no-daemon :platform:shared-core:check :ui:compose-logger:test :ui:compose-logger:stageLoggerWorkspace :ui:javafx-desktop:stageJavaFxLinux
          packaging/java21/build-linux-app-image.sh build/java21
          packaging/steamos/build-steamos-bundle.sh
          cd build/steamos
          zip -qr ../RomRaider2_SteamOS_1.1.1_x64.zip \
            RomRaider2_SteamOS_1.1.1_x64
          cd ..
          sha256sum RomRaider2_SteamOS_1.1.1_x64.zip \
            >RomRaider2_SteamOS_1.1.1_x64.zip.sha256
      - name: Check whitespace
        run: git diff --check
      - name: Upload SteamOS Desktop Mode package
        uses: actions/upload-artifact@v4
        with:
          name: RomRaider2-1.1.1-SteamOS-x64
          path: |
            build/RomRaider2_SteamOS_1.1.1_x64.zip
            build/RomRaider2_SteamOS_1.1.1_x64.zip.sha256
          if-no-files-found: error
