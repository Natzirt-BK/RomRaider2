name: RomRaider2 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify shared versions and rejection fixtures
        run: bash packaging/test-version-check.sh

  linux-test:
    needs: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant xvfb openbox x11-utils dbus-daemon python3-gi
      - name: Verify dependencies, test, and build
        run: |
          packaging/java21/verify-audited-dependencies.sh
          cp packaging/default/settings.xml settings.xml
          timeout 10m xvfb-run -a ant clean unittest
          /usr/bin/python3 packaging/test-display-awake.py "$JAVA_HOME/bin/java" 'build/test:lib/common/*:lib/testing/*'
          ant clean build-linux
          env RR2_COMPOSE_WINDOW_SMOKE=1 SKIKO_RENDER_API=SOFTWARE bash packaging/run-desktop-window-tests.sh gradle --no-daemon :platform:shared-core:check :ui:compose-logger:test
          env RR2_FX_WINDOW_SMOKE=1 bash packaging/run-desktop-window-tests.sh gradle --no-daemon :ui:javafx-desktop:test :ui:javafx-desktop:stageJavaFxLinux
          python3 packaging/test-elm-serial-pty.py "$JAVA_HOME/bin/java" 'ui/javafx-desktop/build/classes/java/test:ui/javafx-desktop/build/classes/java/main:platform/shared-core/build/classes/java/main:lib/common/jSerialComm-2.11.4.jar'
          packaging/java21/audit-runtime-modules.sh build/linux/lib/RomRaider2.jar
          packaging/java21/build-linux-app-image.sh build/release-1.1.8
          packaging/java21/build-linux-release.sh
      - name: Preserve failed native-window diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-test-diagnostics-${{ github.run_attempt }}
          path: |
            ui/compose-logger/build/test-results/test/*.xml
            ui/javafx-desktop/build/test-results/test/*.xml
          if-no-files-found: ignore
      - name: Check whitespace
        run: git diff --check
      - name: Upload Linux x64 package
        uses: actions/upload-artifact@v4
        with:
          name: RomRaider2-1.1.8-Linux-x64
          path: |
            build/releases/RomRaider2_ECU_Studio_1.1.8_Linux_x64.zip
            build/releases/RomRaider2_ECU_Studio_1.1.8_Linux_x64.zip.sha256
          if-no-files-found: error

  windows-x64-package:
    needs: version-consistency
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - name: Install Ant
        shell: pwsh
        run: choco install ant --no-progress -y
      - name: Test and compile Windows application
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Copy-Item packaging/default/settings.xml settings.xml
          ant clean unittest
          $env:RR2_NATIVE_AWAKE_TEST = "1"
          java -cp "build/test;lib/common/*;lib/testing/*" com.romraider.ui.DesktopDisplayAwakeNativeProbe
          $env:RR2_NATIVE_AWAKE_TEST = $null
          ant clean build-windows
          gradle --no-daemon :platform:shared-core:check :ui:compose-logger:test :ui:javafx-desktop:test :ui:javafx-desktop:stageJavaFxWindows
      - name: Build J2534 architecture helpers
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          ./packaging/java21/build-j2534-bridges.ps1
      - name: Build Windows application image
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          ./packaging/java21/build-windows-app-image.ps1
      - name: Verify and archive Windows package
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          ./packaging/java21/build-windows-release.ps1
      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: RomRaider2-1.1.8-Windows-x64
          path: |
            build/releases-windows/RomRaider2_ECU_Studio_1.1.8_Windows_x64.zip
            build/releases-windows/RomRaider2_ECU_Studio_1.1.8_Windows_x64.zip.sha256
          if-no-files-found: error
