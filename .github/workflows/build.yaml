name: RomRaider2 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant xvfb
      - name: Verify dependencies, test, and build
        run: |
          packaging/java21/verify-audited-dependencies.sh
          cp packaging/default/settings.xml settings.xml
          timeout 10m xvfb-run -a ant clean unittest
          ant clean build-linux
          packaging/java21/audit-runtime-modules.sh build/linux/lib/RomRaider2.jar
          packaging/java21/build-linux-app-image.sh build/release-candidate-1.1.0
          packaging/java21/build-linux-release.sh
      - name: Check whitespace
        run: git diff --check
      - name: Upload Linux x64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: RomRaider2-1.1.0-RC3-Linux-x64
          path: |
            build/releases/RomRaider2_ECU_Studio_1.1.0_Linux_x64.zip
            build/releases/RomRaider2_ECU_Studio_1.1.0_Linux_x64.zip.sha256
          if-no-files-found: error

  windows-x64-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - name: Install Ant
        shell: pwsh
        run: choco install ant --no-progress -y
      - name: Build Windows application
        shell: pwsh
        run: |
          Copy-Item packaging/default/settings.xml settings.xml
          ant clean unittest
          ant clean build-windows
          ./packaging/java21/build-j2534-bridges.ps1
          ./packaging/java21/build-windows-app-image.ps1
          ./packaging/java21/build-windows-release.ps1
      - name: Upload Windows x64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: RomRaider2-1.1.0-RC3-Windows-x64
          path: |
            build/releases-windows/RomRaider2_ECU_Studio_1.1.0_Windows_x64.zip
            build/releases-windows/RomRaider2_ECU_Studio_1.1.0_Windows_x64.zip.sha256
          if-no-files-found: error
