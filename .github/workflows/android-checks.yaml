name: Android regression checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'platform/android/**'
      - 'platform/shared-core/**'
      - 'packaging/android/**'
      - '.github/workflows/android-checks.yaml'
  pull_request:
    paths:
      - 'platform/android/**'
      - 'platform/shared-core/**'
      - 'packaging/android/**'
      - '.github/workflows/android-checks.yaml'

permissions:
  contents: read

jobs:
  offline-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Unit tests and isolated automation packages
        run: |
          set -euo pipefail
          gradle --no-daemon -p platform/android -Prr2AndroidTestBuildType=automation \
            -Prr2AndroidVersionCode=900001 -Prr2AndroidVersionName=1.1.2 \
            :shared-core:check :app:testAutomationUnitTest :app:lintAutomation \
            :app:assembleAutomation :app:assembleAutomationAndroidTest
          cp platform/android/app/build/outputs/apk/automation/app-automation.apk "$RUNNER_TEMP/automation-initial.apk"
          cp platform/android/app/build/outputs/apk/androidTest/automation/app-automation-androidTest.apk "$RUNNER_TEMP/automation-test.apk"
          gradle --no-daemon -p platform/android -Prr2AndroidTestBuildType=automation \
            -Prr2AndroidVersionCode=900002 -Prr2AndroidVersionName=1.1.3 :app:assembleAutomation
      - name: Start isolated Android emulator
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          # SDK tools and emulator versions may choose different default AVD roots.
          export ANDROID_USER_HOME="$RUNNER_TEMP/rr2-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-36;default;x86_64'
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name rr2-automation --package 'system-images;android-36;default;x86_64'
          test -f "$ANDROID_AVD_HOME/rr2-automation.ini"
          nohup "$ANDROID_HOME/emulator/emulator" -avd rr2-automation -no-window -no-audio \
            -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2 -port 5554 \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
            if [[ $(timeout 10 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/emulator.log"
          echo 'Android emulator boot timed out.' >&2
          exit 1
      - name: Restart, upgrade, and recording-preservation checks
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt" bash packaging/android/check-lifecycle.sh \
            emulator-5554 "$RUNNER_TEMP/automation-initial.apk" "$RUNNER_TEMP/automation-test.apk" \
            platform/android/app/build/outputs/apk/automation/app-automation.apk
      - name: Open Android-exported synthetic CSV with desktop parser
        run: |
          set -euo pipefail
          adb -s emulator-5554 exec-out run-as com.romraider.mobile.automation \
            cat files/automation-export.csv > "$RUNNER_TEMP/android-export.csv"
          mkdir "$RUNNER_TEMP/csv-check"
          javac -d "$RUNNER_TEMP/csv-check" \
            src/main/java/com/romraider/logger/analysis/LogChannel.java \
            src/main/java/com/romraider/logger/analysis/LogDataset.java \
            src/main/java/com/romraider/logger/analysis/RomRaiderCsvLogParser.java \
            packaging/android/DesktopCsvCompatibilityCheck.java
          java -cp "$RUNNER_TEMP/csv-check" DesktopCsvCompatibilityCheck "$RUNNER_TEMP/android-export.csv"
      - name: Stop emulator
        if: always()
        run: timeout 10 adb -s emulator-5554 emu kill || true
      - name: Retain emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: ${{ runner.temp }}/emulator.log
          retention-days: 3
          if-no-files-found: ignore
